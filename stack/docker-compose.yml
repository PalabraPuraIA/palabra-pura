# Palabra Pura — Docker Compose

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: palabra-pura-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: palabra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: palabra_pura
    volumes:
      - pp_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ../db/schema.clean.sql:/import/schema.clean.sql:ro
      - ../db/data.sql:/import/data.sql:ro
    ports:
      - "5488:5432"
    networks:
      - pp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palabra -d palabra_pura"]
      interval: 10s
      timeout: 5s
      retries: 30

  n8n:
    image: n8nio/n8n:1.109.1
    container_name: palabra-pura-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5688/}
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_SECURE_COOKIE: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: palabra
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pp_n8n_data:/home/node/.n8n
      - ../n8n-workflows:/workflows:ro
    ports:
      - "5688:5678"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pp_net

  web:
    image: nginx:1.27-alpine
    container_name: palabra-pura-web
    restart: unless-stopped
    volumes:
      - ../web/app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    networks:
      - pp_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: palabra-pura-tunnel
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://web:80
    depends_on:
      - web
    networks:
      - pp_net

networks:
  pp_net:
    driver: bridge

volumes:
  pp_pgdata:
  pp_n8n_data:
