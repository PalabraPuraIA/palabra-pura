<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Palabra Pura</title>
  <link rel="icon" type="image/png" href="./assets/logo-icono.png" />
  <link rel="apple-touch-icon" href="./assets/logo-icono.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--f-body);
      color: var(--c-ink);
      background:
        var(--g-halo),
        radial-gradient(1000px 480px at 0% 0%, rgba(139, 123, 255, .2), transparent 55%),
        radial-gradient(900px 420px at 100% 10%, rgba(255, 0, 102, .18), transparent 50%),
        var(--c-bg);
    }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
    }

    .login-card {
      width: min(440px, 100%);
      padding: 28px 26px 24px;
      border-radius: var(--r-xl);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--shadow-card), var(--shadow-inner);
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .login-brand__logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      object-fit: contain;
      /* PNG con fondo negro: se funde en UI oscura */
      mix-blend-mode: lighten;
      animation: brand-spin 14s linear infinite;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    @media (prefers-reduced-motion: reduce) {
      .login-brand__logo { animation: none; }
    }

    .login-brand__eyebrow {
      margin: 0;
      font-size: .6rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--c-rose);
    }

    .login-brand__name {
      margin: 2px 0 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -.01em;
      color: var(--c-ink);
      line-height: 1.2;
    }

    .login-brand__name span {
      color: var(--c-rose);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: clamp(1.55rem, 3vw, 1.85rem);
      letter-spacing: -.02em;
      background: var(--g-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .login-card .sub {
      margin: 0 0 22px;
      color: var(--c-ink-soft);
      font-size: .92rem;
      line-height: 1.55;
      max-width: 36ch;
    }

    .login-card .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .login-card .field span {
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--c-ink-soft);
    }

    .login-card input {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      font-size: .95rem;
      padding: 13px 14px;
      border: 1px solid var(--c-line);
      border-radius: var(--r-md);
      background: var(--c-surface-2);
      color: var(--c-ink);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .login-card input:focus {
      border-color: color-mix(in srgb, var(--c-rose) 55%, var(--c-line));
      box-shadow: 0 0 0 3px var(--c-rose-tint);
    }

    .login-card input::placeholder {
      color: var(--c-ink-faint);
    }

    .login-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: var(--r-pill);
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .login-btn--primary {
      background: var(--g-brand);
      color: var(--c-white);
      box-shadow: var(--shadow-rose);
      border: none;
    }

    .login-btn--primary:hover {
      box-shadow: 0 16px 32px -14px rgba(255, 0, 102, .55);
    }

    .login-btn--ghost {
      background: transparent;
      color: var(--c-ink);
      border-color: var(--c-line);
    }

    .login-btn--ghost:hover {
      border-color: var(--c-rose);
      color: var(--c-rose);
    }

    .login-msg {
      margin: 14px 0 0;
      font-size: .88rem;
      line-height: 1.4;
    }

    .login-msg--err {
      color: #ff6b8a;
    }

    .login-foot {
      margin: 18px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--c-line-soft);
      font-size: .78rem;
      color: var(--c-ink-faint);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" data-login-form>
      <div class="login-brand">
        <img
          class="login-brand__logo"
          src="./assets/logo-icono.png"
          alt="Palabra Pura"
          width="48"
          height="48"
          decoding="async"
        />
        <div>
          <p class="login-brand__eyebrow">Enciclopedia</p>
          <p class="login-brand__name">de <span>Palabra Pura</span></p>
        </div>
      </div>

      <h1>Ingresar</h1>
      <p class="sub">El chat sigue abierto para todos. Este acceso es solo para el panel de administración.</p>

      <label class="field">
        <span>Usuario</span>
        <input type="text" name="username" autocomplete="username" placeholder="Tu usuario" required />
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
      </label>

      <div class="login-actions">
        <button class="login-btn login-btn--primary" type="submit" data-submit>Entrar</button>
        <a class="login-btn login-btn--ghost" href="./">Ir al chat</a>
      </div>
      <p class="login-msg" data-msg hidden></p>
      <p class="login-foot">Panel de Blaze · Escuela Bíblica</p>
    </form>
  </div>
  <script type="module" src="./js/login-page.js"></script>
</body>
</html>
