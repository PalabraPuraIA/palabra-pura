<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Dashboard — Enciclopedia de Palabra Pura</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f5f6f9; color: #1c1d2b; }
    .bar { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 14px; background:#fff; border-bottom:1px solid #e4e6ec; font-size:13px; }
    .wrap { height: calc(100% - 46px); position: relative; }
    iframe { border:0; width:100%; height:100%; background:#fff; }
    .msg { position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; }
    .msg h1 { margin:0 0 8px; font-size:1.15rem; }
    .msg p { max-width:46ch; line-height:1.5; color:#5c6070; margin:0 auto; }
    .hidden { display:none !important; }
    a { color:#2b2fa8; font-weight:600; text-decoration:none; }
  </style>
</head>
<body>
  <div class="bar">
    <div><strong>Enciclopedia de Palabra Pura</strong> · Dashboard</div>
    <div><a href="./index.html">Chat</a></div>
  </div>
  <div class="wrap">
    <div class="msg" id="status"><div>
      <h1 id="statusTitle">Cargando…</h1>
      <p id="statusText">Buscando el servidor público actual. Esta página fija no cambia.</p>
    </div></div>
    <iframe id="app" class="hidden" title="Dashboard"></iframe>
  </div>
  <script>
    const PATH = "/dashboard/";
    const FALLBACK_BASE = "https://trends-then-pipe-airlines.trycloudflare.com";

    function showStatus(title, text) {
      document.getElementById("statusTitle").textContent = title;
      document.getElementById("statusText").textContent = text;
      document.getElementById("status").classList.remove("hidden");
      document.getElementById("app").classList.add("hidden");
    }

    async function probe(base) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 9000);
      try {
        const res = await fetch(base.replace(/\/+$/, "") + "/api/health", {
          cache: "no-store",
          signal: ctrl.signal,
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data?.ok) throw new Error("health not ok");
        return true;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function refresh() {
      try {
        let base = FALLBACK_BASE;
        try {
          const res = await fetch("./public-url.json?_=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            base = String(data.baseUrl || data.chatUrl || FALLBACK_BASE);
          }
        } catch (_) { /* usa el fallback */ }
        base = base.replace(/\/+$/, "");
        if (!base) throw new Error("sin URL pública publicada");

        showStatus("Comprobando servidor…", "Hay una URL publicada. Verificando que responda…");
        try { await probe(base); } catch (_) { /* el iframe igual puede cargar */ }

        const next = base + PATH;
        const frame = document.getElementById("app");
        if (frame.getAttribute("src") !== next) frame.setAttribute("src", next);
        frame.classList.remove("hidden");
        document.getElementById("status").classList.add("hidden");
      } catch (err) {
        showStatus(
          "Servidor no disponible",
          "El dashboard público está apagado o el túnel caducó. Enciende el servidor fintek-local y espera ~2 minutos (o abre http://localhost:8088/dashboard/ en esta Mac). Detalle: " + err.message,
        );
      }
    }
    refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
